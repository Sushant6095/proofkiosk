# ProofKiosk — sensor loop SOP (EXAMPLE)
#
# Execution-contract example for reading a sensor and building a hash-chained
# attestation. The pinned host does not headlessly dispatch these ordinary tool
# steps, and this repository ships neither bme280_read nor the signer/submission
# sidecar, so the cron declaration is not evidence of a running loop.
#
# `bme280_read` stands in for any sensor tool exposed by the peripheral feature set
# (`--features hardware,peripheral-rpi`). Steps live in SOP.md under `## Steps`.
# Validate with:
#   zeroclaw sop validate proofkiosk-sensor-loop

[sop]
name = "proofkiosk-sensor-loop"
description = "Attest an environmental sensor reading on-chain on a fixed cadence."
version = "0.1.0"
deterministic = true
max_concurrent = 1

[[triggers]]
type = "cron"
expression = "0 */5 * * * *"   # every 5 minutes
