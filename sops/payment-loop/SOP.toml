# ProofKiosk — payment loop SOP (EXAMPLE)
#
# Execution-contract example only. The pinned host validates this cron trigger
# but does not headlessly dispatch its ordinary plugin/tool steps; an external
# driver is required. See SOP.md before treating this as runnable automation.
#
# A signed/finalized fulfillment marker can make watcher calls return
# AlreadyFulfilled while it remains in the bounded scan. Host-side trusted order
# persistence and one exclusive claim are implemented, but exactly-once physical
# delivery is not: no actuator/recovery driver or delivery sensor is shipped.
#
# Steps live in SOP.md under `## Steps` — this runtime parses them from Markdown,
# not from TOML. Validate with:
#   zeroclaw sop validate proofkiosk-payment-loop

[sop]
name = "proofkiosk-payment-loop"
description = "Fire the delivery relay only after an on-chain USDC payment is verified."
version = "0.1.0"
# Deterministic: steps run sequentially with no LLM round-trip between them, so
# the relay decision comes from the routing guard, never from model prose.
deterministic = true
# Limit simultaneous runs. This is not a durable per-reference lock.
max_concurrent = 1

[[triggers]]
type = "cron"
expression = "*/10 * * * * *"   # poll every 10s while a charge is outstanding
