<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProofKiosk</title>
<style>
  :root {
    /* Instrumentation palette — charcoal with a green cast, like lab hardware. */
    --base:   oklch(15% 0.012 165);
    --base-2: oklch(12% 0.010 165);
    --panel:  oklch(20% 0.014 165);
    --edge:   oklch(29% 0.018 165);
    --ink:    oklch(95% 0.008 160);
    --muted:  oklch(63% 0.013 165);
    --faint:  oklch(45% 0.012 165);

    --amber:  oklch(80% 0.155 78);
    --verify: oklch(74% 0.165 152);
    --live:   oklch(76% 0.130 215);
    --halt:   oklch(66% 0.200 25);

    --stage: var(--amber);

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --gap: clamp(14px, 1.6vw, 26px);
    --lift: 0 1px 0 oklch(100% 0 0 / .06),
            0 2px 6px oklch(8% 0.02 165 / .5),
            0 16px 40px oklch(8% 0.02 165 / .45);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(120% 90% at 15% 0%, oklch(23% 0.022 168) 0%, transparent 55%),
      radial-gradient(90% 80% at 100% 100%, oklch(20% 0.020 195) 0%, transparent 50%),
      var(--base);
    color: var(--ink);
    font-family: var(--sans);
    font-size: clamp(14px, 1.05vw, 18px);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* Grain — keeps large flat panels from reading as flat vector. */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .16;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
    mix-blend-mode: overlay;
  }

  .screen {
    height: 100vh; display: grid;
    grid-template-rows: auto 1fr auto;
    gap: var(--gap); padding: var(--gap);
  }

  /* ---------- header ---------- */
  header { display: flex; align-items: baseline; gap: 16px; }
  .wordmark {
    font-size: clamp(18px, 1.7vw, 26px); font-weight: 700;
    letter-spacing: -.035em;
  }
  .wordmark span { color: var(--verify); }
  .chip {
    font-family: var(--mono); font-size: .72em; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--edge); border-radius: 100px; padding: 4px 11px;
  }
  .clock { margin-left: auto; font-family: var(--mono); color: var(--faint); }

  /* ---------- main split ---------- */
  .split {
    display: grid; grid-template-columns: minmax(260px, 38%) 1fr;
    gap: var(--gap); min-height: 0;
  }

  /* QR — deliberately the brightest object on screen: it must scan, and it
     should read as the one thing the customer is meant to touch. */
  .qr-card {
    background: oklch(99% 0 0); border-radius: 18px; box-shadow: var(--lift);
    display: grid; grid-template-rows: 1fr auto; gap: 10px;
    padding: clamp(14px, 1.6vw, 26px); min-height: 0;
  }
  .qr-card svg, .qr-card img {
    width: 100%; height: 100%; display: block; object-fit: contain;
    transition: opacity .6s var(--ease), filter .6s var(--ease);
  }
  /* Once the chain has answered, the QR is spent — fade it so attention moves
     to the verdict instead of inviting a second scan. */
  body[data-verified="1"] .qr-card img,
  body[data-stage="expired"] .qr-card img { opacity: .13; filter: grayscale(1); }
  .qr-frame { min-height: 0; display: grid; place-items: center; }
  .qr-note {
    font-family: var(--mono); font-size: .74em; letter-spacing: .1em;
    text-transform: uppercase; color: oklch(45% 0.01 165); text-align: center;
  }
  .qr-missing {
    display: grid; place-items: center; text-align: center; padding: 18px;
    color: var(--halt); font-family: var(--mono); font-size: .82em; line-height: 1.6;
  }

  .detail { display: grid; grid-template-rows: auto auto auto 1fr; gap: var(--gap); min-height: 0; }

  /* The verification checklist is the point of the product: eight things are
     checked before anything physical moves. Dim until the chain says so. */
  .checks-title {
    font-family: var(--mono); font-size: .72em; letter-spacing: .16em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 10px;
  }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; }
  .check {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: clamp(11px, .92vw, 15px);
    color: var(--faint); transition: color .45s var(--ease);
  }
  .check i {
    flex: none; width: 15px; height: 15px; border-radius: 4px;
    border: 1.5px solid var(--edge); font-style: normal; font-size: 10px;
    display: grid; place-items: center; color: transparent;
    transition: background-color .45s var(--ease), border-color .45s var(--ease), color .45s var(--ease);
  }
  body[data-verified="1"] .check { color: var(--ink); }
  body[data-verified="1"] .check i {
    background: var(--verify); border-color: var(--verify); color: var(--base-2);
  }

  .item h1 {
    font-size: clamp(30px, 4.2vw, 62px); font-weight: 700;
    letter-spacing: -.045em; line-height: .95; text-transform: capitalize;
  }
  .price {
    margin-top: 6px; font-family: var(--mono);
    font-size: clamp(17px, 1.9vw, 28px); color: var(--verify);
  }
  .price small { color: var(--muted); font-size: .62em; letter-spacing: .12em; }

  /* ---------- state ---------- */
  .state {
    position: relative; overflow: hidden;
    background: var(--panel); border: 1px solid var(--edge);
    border-left: 4px solid var(--stage); border-radius: 14px;
    padding: clamp(12px, 1.5vw, 22px) clamp(16px, 1.8vw, 26px);
    box-shadow: var(--lift);
  }
  .state::before {                     /* sweep: transform only */
    content: ""; position: absolute; inset: 0; opacity: .5;
    background: linear-gradient(100deg, transparent 35%, var(--stage) 50%, transparent 65%);
    mix-blend-mode: soft-light;
    transform: translateX(-100%);
    animation: sweep 3.4s var(--ease) infinite;
  }
  body[data-stage="delivered"] .state::before,
  body[data-stage="expired"]   .state::before { animation: none; opacity: 0; }
  @keyframes sweep { to { transform: translateX(100%); } }

  .state-row { position: relative; display: flex; align-items: center; gap: 14px; }
  .dot {
    width: 13px; height: 13px; border-radius: 50%; flex: none;
    background: var(--stage); box-shadow: 0 0 0 0 var(--stage);
    animation: ping 1.9s var(--ease) infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 oklch(from var(--stage) l c h / .55); }
    70%  { box-shadow: 0 0 0 14px oklch(from var(--stage) l c h / 0); }
    100% { box-shadow: 0 0 0 0 oklch(from var(--stage) l c h / 0); }
  }
  .state-label {
    font-size: clamp(19px, 2.3vw, 34px); font-weight: 700;
    letter-spacing: -.02em; color: var(--stage);
  }
  .state-sub {
    position: relative; margin-top: 6px; color: var(--muted);
    font-family: var(--mono); font-size: .8em; line-height: 1.5;
  }

  /* ---------- machine data ---------- */
  .facts {
    align-self: end; display: grid; gap: 7px;
    font-family: var(--mono); font-size: clamp(11px, .92vw, 15px);
  }
  .fact { display: grid; grid-template-columns: 8.5em 1fr; gap: 12px; align-items: baseline; }
  .fact dt { color: var(--faint); letter-spacing: .1em; text-transform: uppercase; font-size: .82em; }
  .fact dd { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fact dd.ok { color: var(--verify); }

  /* ---------- ladder ---------- */
  .ladder {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; align-items: start;
  }
  .rung { display: grid; gap: 9px; opacity: .34; transition: opacity .5s var(--ease); }
  .rung[data-on="1"] { opacity: 1; }
  .bar { height: 4px; border-radius: 3px; background: var(--edge); }
  .rung[data-on="1"] .bar { background: var(--verify); }
  .rung[data-active="1"] .bar {
    background: linear-gradient(90deg, var(--live), var(--edge));
    animation: shift 1.5s linear infinite;
    background-size: 200% 100%;
  }
  @keyframes shift { to { background-position: -200% 0; } }
  .rung b {
    font-family: var(--mono); font-size: .74em; letter-spacing: .16em;
    text-transform: uppercase; font-weight: 500; color: var(--muted);
  }
  .rung[data-on="1"] b { color: var(--ink); }

  .boot { display: grid; place-items: center; height: 100vh; gap: 12px; text-align: center; }
  .boot p { color: var(--muted); font-family: var(--mono); font-size: .9em; }

  /* ---------- idle menu ---------- */
  .menu-wrap { height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto;
               gap: var(--gap); padding: var(--gap) clamp(24px, 6vw, 90px); }
  .menu-head { text-align: center; padding-top: clamp(8px, 3vh, 40px); }
  .shop {
    font-family: var(--serif, var(--sans)); font-size: clamp(30px, 5vw, 68px);
    font-weight: 700; letter-spacing: -.045em; line-height: 1;
  }
  .shop em { font-style: normal; color: var(--verify); }
  .menu-kicker {
    margin-top: 12px; font-family: var(--mono); font-size: .78em;
    letter-spacing: .3em; text-transform: uppercase; color: var(--faint);
  }
  .menu-list {
    align-self: center; display: grid; gap: clamp(6px, 1.4vh, 16px);
    max-width: 780px; width: 100%; margin: 0 auto;
  }
  .menu-row {
    display: grid; grid-template-columns: 1fr auto; align-items: baseline;
    gap: 14px; padding: clamp(8px, 1.3vh, 15px) 4px;
    border-bottom: 1px solid var(--edge);
  }
  .menu-row:last-child { border-bottom: none; }
  .menu-name {
    font-size: clamp(17px, 2.1vw, 31px); font-weight: 600; letter-spacing: -.02em;
    text-transform: capitalize;
  }
  .menu-dots { border-bottom: 1px dotted var(--edge); }
  .menu-price {
    font-family: var(--mono); font-size: clamp(15px, 1.8vw, 26px); color: var(--verify);
  }
  .menu-price small { color: var(--muted); font-size: .6em; letter-spacing: .1em; margin-left: 4px; }
  .menu-foot {
    display: grid; gap: 6px; text-align: center; font-family: var(--mono);
    font-size: clamp(10px, .85vw, 13px); color: var(--faint); line-height: 1.6;
  }
  .menu-foot b { color: var(--muted); font-weight: 400; }

  @media (prefers-reduced-motion: reduce) {
    .state::before, .dot, .rung[data-active="1"] .bar { animation: none; }
  }
  @media (max-aspect-ratio: 1/1) {
    .split { grid-template-columns: 1fr; grid-template-rows: minmax(180px, 44%) 1fr; }
  }
</style>
</head>
<body data-stage="awaiting">
<div id="app" class="boot">
  <div class="wordmark">PROOF<span>KIOSK</span></div>
  <p id="boot-msg">waiting for an order…</p>
</div>

<script>
const STAGES = {
  awaiting:   { label: 'AWAITING PAYMENT', color: 'var(--amber)',  rungs: 1, active: 2 },
  claimed:    { label: 'PAID · FINALIZED', color: 'var(--verify)', rungs: 3, active: 0 },
  dispensing: { label: 'DISPENSING',       color: 'var(--live)',   rungs: 3, active: 4 },
  delivered:  { label: 'DELIVERED',        color: 'var(--verify)', rungs: 4, active: 0 },
  expired:    { label: 'EXPIRED',          color: 'var(--halt)',   rungs: 1, active: 0 },
};
const RUNGS = ['charged', 'paid', 'claimed', 'delivered'];

/* Exactly what kiosk-watch validates before a paid verdict. Do not add a row
   here that the verifier does not actually check. */
const QR_NOTE = {
  awaiting:   'scan to pay',
  claimed:    'payment received',
  dispensing: 'dispensing',
  delivered:  'complete',
  expired:    'quote expired',
};

const CHECKS = [
  'recipient', 'exact amount',
  'SPL mint', 'reference account',
  'token decimals', 'payer signer',
  'PKPAY1 item memo', 'finalized commitment',
];

const short = (s, n = 6) => (s && s.length > n * 2 + 2 ? `${s.slice(0, n)}…${s.slice(-n)}` : s || '—');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function subtitle(s) {
  if (s.stage === 'awaiting') {
    const left = Math.max(0, Math.round((s.order.expires_at_ms - s.now_ms) / 1000));
    return `scan with any Solana wallet · quote expires in ${Math.floor(left / 60)}m ${String(left % 60).padStart(2, '0')}s`;
  }
  if (s.stage === 'claimed')    return 'verified on-chain at finalized · exclusive claim held';
  if (s.stage === 'dispensing') return `relay firing on GPIO ${s.delivery?.pin ?? 17}`;
  if (s.stage === 'delivered')  return `pulse ${s.delivery?.pulse_ms ?? '—'}ms via ${s.delivery?.driver ?? '—'} · journalled`;
  if (s.stage === 'expired')    return 'payment window closed · nothing was dispensed';
  return '';
}

/* Rebuilding the DOM every tick would restart the CSS animations once a second,
   which reads as a stutter on camera. Full render only when the stage or the
   order actually changes; otherwise touch just the volatile text. */
let lastKey = null;

function render(s) {
  const app = document.getElementById('app');
  if (!s.ok) {
    // Idle. Show the shop's menu — read from the same operator config the
    // trusted handoff validates against, so what's on screen is what the
    // verifier will gate on. No separate list to fall out of sync.
    const m = s.menu;
    if (!m || !m.items?.length) {
      lastKey = null;
      app.className = 'boot';
      app.innerHTML = `<div class="wordmark">PROOF<span>KIOSK</span></div>
        <p>${esc(s.reason)}</p>`;
      return;
    }
    const key = 'menu|' + m.items.map((i) => `${i.item_id}:${i.price}`).join(',');
    if (key === lastKey) {
      app.querySelector('.clock').textContent = new Date(s.now_ms).toTimeString().slice(0, 8);
      return;
    }
    lastKey = key;
    document.body.dataset.stage = 'menu';
    document.body.dataset.verified = '0';
    app.className = 'menu-wrap';
    app.innerHTML = `
      <header>
        <div class="wordmark">PROOF<span>KIOSK</span></div>
        <div class="chip">solana devnet</div>
        <div class="clock">${new Date(s.now_ms).toTimeString().slice(0, 8)}</div>
      </header>

      <div class="menu-head">
        <div class="shop">${esc(m.label ?? 'ProofKiosk')}</div>
        <div class="menu-kicker">menu · pay in usdc on solana</div>
      </div>

      <div class="menu-list">
        ${m.items.map((i) => `
          <div class="menu-row">
            <div class="menu-name">${esc(String(i.item_id).replace(/_/g, ' '))}</div>
            <div class="menu-price">${esc(i.price)}<small>USDC</small></div>
          </div>`).join('')}
      </div>

      <div class="menu-foot">
        <div>ask the kiosk for an item · a Solana Pay QR appears here · scan it with your own wallet</div>
        <div><b>pays to</b> ${esc(short(m.merchant, 8))}${
          m.max_amount ? ` · <b>per-charge cap</b> ${esc(m.max_amount)} USDC` : ''}</div>
        <div>prices are operator config — the agent cannot change them</div>
      </div>`;
    return;
  }

  const key = `${s.stage}|${s.order.reference}|${s.claim?.claim_id ?? ''}`;
  if (key === lastKey) {
    app.querySelector('.clock').textContent = new Date(s.now_ms).toTimeString().slice(0, 8);
    app.querySelector('.state-sub').textContent = subtitle(s);
    return;
  }
  lastKey = key;
  const st = STAGES[s.stage] ?? STAGES.awaiting;
  document.body.dataset.stage = s.stage;
  document.body.dataset.verified = ['claimed', 'dispensing', 'delivered'].includes(s.stage) ? '1' : '0';
  document.documentElement.style.setProperty('--stage', st.color);

  // Keyed on the reference so a new charge busts the browser cache, and only
  // then — the QR must not be refetched on every 1 Hz poll.
  const qr = s.qr_available
    ? `<div class="qr-frame"><img src="/qr?ref=${encodeURIComponent(s.order.reference)}" alt="Solana Pay QR"></div>
       <div class="qr-note">${QR_NOTE[s.stage] ?? 'scan to pay'}</div>`
    : `<div class="qr-missing">QR renderer unavailable<br><br>sudo apt install -y qrencode</div>`;

  const facts = [
    ['reference', short(s.order.reference), false],
    ['recipient', short(s.order.recipient), false],
    ['mint',      short(s.order.mint), false],
    s.claim ? ['signature', short(s.claim.payment_signature), true] : null,
    s.claim ? ['slot',      String(s.claim.payment_slot), true] : null,
    s.claim ? ['finality',  'finalized', true] : null,
    s.claim ? ['claim',     short(s.claim.claim_id, 8), true] : null,
  ].filter(Boolean);

  app.className = 'screen';
  app.innerHTML = `
    <header>
      <div class="wordmark">PROOF<span>KIOSK</span></div>
      <div class="chip">solana devnet</div>
      <div class="clock">${new Date(s.now_ms).toTimeString().slice(0, 8)}</div>
    </header>

    <div class="split">
      <div class="qr-card">${qr}</div>
      <div class="detail">
        <div class="item">
          <h1>${esc(String(s.order.item_id).replace(/_/g, ' '))}</h1>
          <div class="price">${esc(s.order.amount)} <small>USDC</small></div>
        </div>

        <div class="state">
          <div class="state-row">
            <div class="dot"></div>
            <div class="state-label">${st.label}</div>
          </div>
          <div class="state-sub">${esc(subtitle(s))}</div>
        </div>

        <div>
          <div class="checks-title">verified on-chain before dispense</div>
          <div class="checks">
            ${CHECKS.map((c) => `<div class="check"><i>&#10003;</i>${c}</div>`).join('')}
          </div>
        </div>

        <dl class="facts">
          ${facts.map(([k, v, ok]) =>
            `<div class="fact"><dt>${k}</dt><dd class="${ok ? 'ok' : ''}">${esc(v)}</dd></div>`).join('')}
        </dl>
      </div>
    </div>

    <div class="ladder">
      ${RUNGS.map((name, i) => `
        <div class="rung" data-on="${i < st.rungs ? 1 : 0}" data-active="${i + 1 === st.active ? 1 : 0}">
          <div class="bar"></div><b>${name}</b>
        </div>`).join('')}
    </div>`;
}

async function tick() {
  try {
    render(await (await fetch('/state', { cache: 'no-store' })).json());
  } catch (e) {
    document.getElementById('boot-msg') &&
      (document.getElementById('boot-msg').textContent = 'display server unreachable');
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
