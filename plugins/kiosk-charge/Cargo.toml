[package]
name = "kiosk-charge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT tool plugin: build Solana Pay charge URLs for the ProofKiosk. T1, zero secrets, zero network — the recipient and prices come from operator config, never from the model."
publish = false

# cdylib for the wasm component; rlib so the pure charge core is testable on
# the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiosk-core = { path = "../../crates/kiosk-core" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Host CSPRNG for the charge reference, via `wasi:random/random`. Only inside a
# component: the pure core takes the reference as an argument and stays
# deterministic, so host tests never link this. It adds no `wasi:http` — proven
# by scripts/verify-no-network.sh, which still reports 0 for this plugin.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of a parent workspace.
[workspace]
